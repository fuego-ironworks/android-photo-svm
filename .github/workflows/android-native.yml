name: ICK Android photo region libraries

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'ndk;29.0.14206865'
      - uses: isomorphisms/ai-ci/ick-android@618223d47315a180851c1539197cdcdb761a4b0d
        id: ick
        with:
          abi: ${{ matrix.abi }}
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - name: Build, link and inspect the exact photo adapter
        env:
          ABI: ${{ matrix.abi }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ICK: ${{ steps.ick.outputs.compiler }}
          ICK_STAGE: ${{ runner.temp }}/ick-android-${{ matrix.abi }}-stage
          GNU_TARGET: ${{ steps.ick.outputs.gnu_target }}
          HEADER_TARGET: ${{ steps.ick.outputs.header_target }}
          TARGET_FLAGS: ${{ steps.ick.outputs.target_flags }}
          ICK_BUILTIN_INCLUDE: ${{ steps.ick.outputs.builtin_include }}
        run: |
          make -C android -f Makefile -f ci/native.mk native-build \
            NDK="$ANDROID_HOME/ndk/29.0.14206865" \
            OUT="$RUNNER_TEMP/photo-native-$ABI"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-native-${{ matrix.abi }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/photo-native-${{ matrix.abi }}/
          if-no-files-found: error
